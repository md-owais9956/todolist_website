<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url(todolist.jpg) no-repeat fixed center ;
            background-size: cover;
            margin: 0;
        }
        .container {
            background: #102b8370;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(154, 14, 14, 0.2);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            color: #333;
        }
        input {
            width: 80%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
            background: #f0f0f0;
        }
        button {
            padding: 10px 15px;
            border: none;
            background: #21d614;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #564aa3;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        .delete-btn {
            background: #dc2e3f;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .delete-btn:hover {
            background: #ac1c2a;
        }
        .edit-btn {
            background: #ffa500;
            padding: 5px 10px;
            border-radius: 5px;
            margin-right: 5px;
        }
        .edit-btn:hover {
            background: #cc8400;
        }
        .clear-btn {
            margin-top: 10px;
            width: 100%;
            background: #e7162b;
        }
        .clear-btn:hover {
            background: #b8323d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>To-Do List</h2>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
        <ul id="taskList"></ul>
        <button class="clear-btn" onclick="clearTasks()">Clear All</button>
    </div>
    <script>
        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let taskText = taskInput.value.trim();
            if (taskText === "") return;
            
            let li = document.createElement("li");
            li.innerHTML = `<span onclick="toggleTask(this)">${taskText}</span> 
                            <button class="edit-btn" onclick="editTask(this)">Edit</button>
                            <button class="delete-btn" onclick="removeTask(this)">Delete</button>`;
            document.getElementById("taskList").appendChild(li);
            taskInput.value = "";
        }
        
        function removeTask(button) {
            button.parentElement.remove();
        }
        
        function toggleTask(span) {
            span.classList.toggle("completed");
        }
        
        function editTask(button) {
            let taskText = button.parentElement.querySelector("span");
            let newText = prompt("Edit your task:", taskText.textContent);
            if (newText !== null && newText.trim() !== "") {
                taskText.textContent = newText.trim();
            }
        }
        
        function clearTasks() {
            document.getElementById("taskList").innerHTML = "";
        }
    </script>
</body>
</html>
